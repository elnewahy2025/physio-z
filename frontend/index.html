<!-- frontend/index.html -->
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Physio Center - Physiotherapy Center Management System" />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Physio" />
    <meta name="application-name" content="Physio" />

    <title>Physio Center</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-global-error') || document.createElement('div');
        el.id = 'debug-global-error';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b91c1c;color:#fff;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        el.textContent = 'Runtime JavaScript Error:\n' + (e.error ? (e.error.stack || e.error.message) : (e.message || String(e)));
        if (!document.getElementById('debug-global-error')) {
          (document.body || document.documentElement).prepend(el);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-rejection-error') || document.createElement('div');
        el.id = 'debug-rejection-error';
        el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:999999;background:#991b1b;color:#fff;padding:16px;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 -4px 6px rgba(0,0,0,0.3);';
        el.textContent = 'Unhandled Promise Rejection:\n' + (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection');
        if (!document.getElementById('debug-rejection-error')) {
          (document.body || document.documentElement).appendChild(el);
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
